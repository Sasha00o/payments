services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env-non-dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments-docker"]
      interval: 5s
      timeout: 5s
      retries: 5

  candidate-service:
    build: .
    env_file:
      - .env-non-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0
    environment:
      CALLBACK_URL: http://candidate-service:8080/receipts
    ports:
      - "8081:8081"
    depends_on:
      - candidate-service

volumes:
  postgres-data:
